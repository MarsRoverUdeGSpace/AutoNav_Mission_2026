/**:
  ros__parameters:
    # Keep the ZED ROS graph minimal for local VSLAM on Jetson.
    # VSLAM needs stereo images, camera_info, and IMU. Everything else is disabled.
    general:
      pub_frame_rate: 8.0
      pub_resolution: "CUSTOM"
      # Isaac ROS VSLAM requires even image dimensions. 5.0 from 1920x1080
      # yields 384x216, which is smaller than the previous setting and valid.
      pub_downscale_factor: 5.0
      publish_status: false

    video:
      publish_left_right: true
      publish_rgb: false

    depth:
      publish_depth_map: false
      publish_depth_info: false
      publish_depth_confidence: false
      publish_disparity: false
      publish_point_cloud: false

    sensors:
      publish_imu: true
      publish_imu_tf: false
      publish_imu_raw: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    pos_tracking:
      publish_tf: false
      publish_map_tf: false
      publish_odom_pose: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false

    mapping:
      mapping_enabled: false

    debug:
      disable_nitros: true
